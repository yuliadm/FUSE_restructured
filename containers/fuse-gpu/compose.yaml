services:
  gpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: "${HOST_UID:-1000}"
        GROUP_ID: "${HOST_GID:-1000}"

    image: fuse-gpu:vggt-omega_hunyuan3d2.1_kaolin0.18
    container_name: fuse-gpu

    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    gpus: all
    shm_size: "8gb"
    init: true

    ports:
      - "127.0.0.1:${FUSE_GPU_PORT:-8890}:8890"

    env_file:
      - .env   # HF_TOKEN for facebook/VGGT-Omega (gated) — see configure-env.sh

    volumes:
      - type: bind
        source: "${FUSE_NOTEBOOKS_DIR:-../../notebooks}"
        target: /workspace/notebooks
        bind:
          create_host_path: false
      - type: bind
        source: "${FUSE_DATA_DIR:-../../data}"
        target: /workspace/data
        bind:
          create_host_path: false
      - type: bind
        source: "${FUSE_GPU_CACHE_DIR:-./cache}"
        target: /workspace/.cache
        bind:
          create_host_path: false

    environment:
      HOME: /home/fuse
      XDG_CACHE_HOME: /workspace/.cache/xdg
      HF_HOME: /workspace/.cache/huggingface
      TORCH_HOME: /workspace/.cache/torch
      U2NET_HOME: /workspace/.cache/rembg
      PYTHONPATH: /opt/vggt-omega:/opt/Hunyuan3D-2.1/hy3dshape:/workspace
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    working_dir: /workspace

    command:
      - python
      - -m
      - jupyterlab
      - --ip=0.0.0.0
      - --port=8890
      - --no-browser
      - --ServerApp.root_dir=/workspace
      - --IdentityProvider.token=
      - --ServerApp.password=
      - --LabApp.extension_manager=readonly

    restart: unless-stopped